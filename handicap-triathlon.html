<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Handicap Triathlon Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#104067">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef5f9;--card:#fff;--ink:#104067;--mute:#58728a;--line:#d3e1ea;--acc:#f17040;--acc-ink:#082338;--blue:#53bae8;--go:#1d8a5a;--f:#c2417a;--m:#2563a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08233a;--card:#0e3354;--ink:#e8f3fa;--mute:#9fbdd0;--line:#245070;--go:#3cc88a;--f:#f27bb0;--m:#6fa8ee}}
:root[data-theme="dark"]{--bg:#08233a;--card:#0e3354;--ink:#e8f3fa;--mute:#9fbdd0;--line:#245070;--go:#3cc88a;--f:#f27bb0;--m:#6fa8ee}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
main{max-width:760px;margin:0 auto;padding:14px}
h1{font:700 26px "Barlow Condensed",system-ui,sans-serif;margin:4px 0 12px}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px;min-height:46px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-bottom:10px}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 14px;min-height:46px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button.s{min-height:36px;padding:5px 10px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>*{flex:1 1 auto}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1}.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#104067;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;border-radius:0;color:#b9cbd1;min-height:60px;font-size:14px}
nav button.on{color:#fff;box-shadow:inset 0 3px 0 var(--acc)}
.clock{font:700 76px/1 "Barlow Condensed",system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:center;margin:6px 0 12px}
.next{background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.next b{font-size:18px}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}.item .n{flex:1;min-width:0}.item .n b{display:block;overflow:hidden;text-overflow:ellipsis}
.item small,.mute{color:var(--mute)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}.tag.F{background:var(--f)}.tag.M{background:var(--m)}
.t{font:700 22px "Barlow Condensed",system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.racing{border-left:5px solid var(--go);padding-left:8px;cursor:pointer}.waiting{opacity:.6}.done{background:color-mix(in srgb,var(--go) 12%,transparent)}
.top{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.top .card{margin:0}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:9px 6px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:13px;color:var(--mute);border:0}
td.t{font-size:19px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;display:none;z-index:9;max-width:90%}
@media (prefers-reduced-motion:no-preference){button:active{transform:scale(.98)}}
button,.item{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.hd{background:#fff;display:flex;justify-content:center;padding:8px 14px;border-bottom:5px solid;border-image:linear-gradient(90deg,#f17040 33%,#104067 33% 66%,#53bae8 66%) 1}
.hd img{height:46px;max-width:100%}
.bib{background:#104067;color:#fff;border-bottom:3px solid #53bae8;border-radius:6px;min-width:44px;text-align:center;padding:3px 6px;font:700 21px "Barlow Condensed",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.ov{position:fixed;inset:0;background:rgba(8,35,56,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.ov .box{background:var(--card);border-radius:14px;padding:18px;max-width:340px;width:100%}
.ov p{margin:0 0 14px;font-weight:600}
.rc{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:10px}
.rc .clock{font-size:46px;margin:0;text-align:left;flex:1}.rc .btns{flex:0 0 auto;flex-wrap:nowrap}.rc .btns>*{min-height:44px;padding:8px 12px}
.next{padding:7px 12px;margin-bottom:8px}.seg{margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}.grid.g2{grid-template-columns:1fr 1fr}
.tile{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:8px;text-align:center;padding:3px 3px;height:58px;display:flex;flex-direction:column;justify-content:center;min-width:0;user-select:none;-webkit-user-select:none}
.tile.F{border-top-color:var(--f)}.tile.M{border-top-color:var(--m)}
.tile b{font:700 25px/1 "Barlow Condensed",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.tile small{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.tile.wait{opacity:.45}.tile.rac{cursor:pointer;background:color-mix(in srgb,var(--go) 20%,var(--card));box-shadow:inset 0 0 0 2px var(--go)}
.tile.fin{cursor:pointer;background:var(--ink);color:var(--bg)}.tile.fin small{color:var(--bg)}
.kd{font:700 64px/1.1 "Barlow Condensed",system-ui,sans-serif;text-align:center;min-height:70px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.pad button{min-height:54px;font-size:22px}
.tile{height:74px;gap:1px}.g2 .tile{height:58px}
.tile .nm{font-size:10px;line-height:1.1;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.tile .ft{font-weight:700;font-size:12px;color:var(--ink)}.tile.fin .ft{color:var(--bg)}
</style>
</head>

<main id="app"></main>
<div id="toast"></div>
<div class="ov" id="dlg" hidden><div class="box"><p id="dmsg"></p><div class="btns"><button id="dno">Cancel</button><button class="p" id="dyes">Confirm</button></div></div></div>
<nav id="nav"></nav>
<script>
const KEY='hcTri.v1';
let S={people:[],clock:{running:false,startedAt:0,acc:0},tab:'entrants',raceView:'grid',kb:'',startDir:'asc',resSort:'finish',resFilter:'all',mode:'legs',edit:null};
try{const r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
S.people.forEach((p,i)=>{if(!p.bib)p.bib=i+1});let lastSig='';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}:${pad(m)}:${pad(s%60)}`:`${pad(m)}:${pad(s%60)}`};
const fmtClock=s=>{s=Math.max(0,Math.floor(s));return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`};
function parseT(v){if(v==null||v==='')return null;if(typeof v==='number')return v<1?Math.round(v*86400):Math.round(v*60);
 const p=String(v).trim().split(':').map(Number);if(p.some(isNaN))return null;
 if(p.length===2)return p[0]*60+p[1];if(p.length===3)return p[0]*3600+p[1]*60+p[2];if(p.length===1)return p[0]*60;return null}
const elapsed=()=>S.clock.acc+(S.clock.running?(Date.now()-S.clock.startedAt)/1000:0);
const totalOf=p=>p.total;
const maxTotal=()=>Math.max(0,...S.people.map(totalOf));
const startOf=p=>maxTotal()-p.total;
const nextBib=()=>Math.max(0,...S.people.map(p=>p.bib||0))+1;
const cd=(s,pre)=>`data-cd="${s}" data-pre="${pre}"`;
function ask(msg,cb){$('#dmsg').textContent=msg;ask.cb=cb;$('#dlg').hidden=false}
function sig(){const e=elapsed();return S.tab+S.people.map(p=>p.finish!=null?'d':(startOf(p)<=e&&(e>0||S.clock.running)?'r':'w')).join('')+(S.clock.running?1:0)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}

// mm:ss typing without colon (digits fill from the right)
function maskTime(el){const d=el.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,5);
 if(!d){el.value='';return}const x=d.padStart(4,'0');el.value=x.slice(0,-2)+':'+x.slice(-2)}
document.addEventListener('input',e=>{if(e.target.classList.contains('tm')){maskTime(e.target);if(e.target.closest('#form'))updTotal()}});
function updTotal(){const el=$('#calc');if(!el)return;const v=readTimes();el.textContent=v==null?'--:--':fmt(v)}
function readTimes(){if(S.mode==='total')return parseT($('#f-total').value);
 const a=['swim','bike','run'].map(k=>parseT($('#f-'+k).value));return a.some(x=>x==null)?null:a[0]+a[1]+a[2]}

const tabs=[['entrants','Entrants'],['start','Start list'],['race','Race'],['results','Results']];
function render(){
 $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('');
 const v={entrants:vEntrants,start:vStart,race:vRace,results:vResults}[S.tab]();
 $('#app').innerHTML=v;lastSig=sig();save();if(S.tab==='entrants')updTotal();
}
function nextBanner(){
 const e=elapsed(),w=S.people.filter(p=>startOf(p)>e).sort((a,b)=>startOf(a)-startOf(b));
 if(!S.people.length)return '';
 if(!S.clock.running&&e===0)return `<div class="next">Start the clock to begin. First off: <b>${esc(S.people.slice().sort((a,b)=>startOf(a)-startOf(b))[0].name)}</b></div>`;
 if(!w.length)return `<div class="next">All athletes have started.</div>`;
 const n=w[0];return `<div class="next">Next start: <b>${esc(n.name)}</b> in <b class="t">${fmt(Math.ceil(startOf(n)-e))}</b>${w[1]?`<br><small>then ${esc(w[1].name)} at ${fmt(startOf(w[1]))}</small>`:''}</div>`}

function vEntrants(){
 const ed=S.people.find(p=>p.id===S.edit),L=ed&&ed.legs;
 const tv=x=>x==null?'':fmt(x);
 return `<h1>Entrants</h1>
 <div class="card"><h2>${ed?'Edit athlete':'Add athlete'}</h2><div id="form">
 <div class="row" style="grid-template-columns:1fr 2fr 1.3fr"><div><label>Race no.</label><input id="f-bib" inputmode="numeric" value="${ed?ed.bib:nextBib()}"></div><div><label>Name</label><input id="f-name" value="${ed?esc(ed.name):''}" autocomplete="off"></div>
 <div><label>Gender</label><select id="f-g"><option value="F" ${ed&&ed.g==='F'?'selected':''}>Female</option><option value="M" ${ed&&ed.g==='M'?'selected':''}>Male</option></select></div></div>
 <div class="seg"><button data-mode="legs" class="${S.mode==='legs'?'on':''}">Swim / bike / run</button><button data-mode="total" class="${S.mode==='total'?'on':''}">Total time</button></div>
 ${S.mode==='legs'?`<div class="row" style="grid-template-columns:repeat(3,1fr)">${['swim','bike','run'].map(k=>`<div><label>${k[0].toUpperCase()+k.slice(1)} mm:ss</label><input class="tm" id="f-${k}" inputmode="numeric" placeholder="00:00" value="${L?tv(L[k]):''}"></div>`).join('')}</div>`
 :`<div class="row"><div><label>Total race time mm:ss</label><input class="tm" id="f-total" inputmode="numeric" placeholder="00:00" value="${ed&&!L?tv(ed.total):''}"></div></div>`}
 <p class="mute" style="margin:0 0 10px">Type digits only: 1234 becomes 12:34. Total: <b id="calc">--:--</b></p>
 <div class="btns"><button class="p" data-act="save">${ed?'Save changes':'Add athlete'}</button>${ed?'<button data-act="cancel">Cancel</button>':''}</div></div></div>
 <div class="card"><h2>Upload spreadsheet</h2>
 <p class="mute" style="margin-top:0">Excel or CSV with columns: Bib (optional, numbered automatically if blank), Name, Gender (M/F), Swim, Bike, Run, Total. Use Total alone, or Swim+Bike+Run. Format time cells as Text, written mm:ss.</p>
 <div class="btns"><input type="file" id="file" accept=".xlsx,.xls,.csv" style="flex:2"><button data-act="tpl">Download template</button></div></div>
 <div class="card"><h2>${S.people.length} athlete${S.people.length===1?'':'s'}</h2>
 ${S.people.slice().sort((a,b)=>a.bib-b.bib).map(p=>`<div class="item"><span class="bib">${p.bib}</span><span class="tag ${p.g}">${p.g}</span><div class="n"><b>${esc(p.name)}</b><small>${p.legs?`${fmt(p.legs.swim)} / ${fmt(p.legs.bike)} / ${fmt(p.legs.run)}`:'Total only'}</small></div><span class="t">${fmt(p.total)}</span><button class="s" data-edit="${p.id}">Edit</button><button class="s" data-del="${p.id}" aria-label="Delete">✕</button></div>`).join('')||'<p class="mute">No athletes yet. Add one above or upload a spreadsheet.</p>'}
 ${S.people.length?'<div class="btns" style="margin-top:10px"><button data-act="clear">Remove all athletes</button></div>':''}</div>`}

function vStart(){
 const e=elapsed(),l=S.people.slice().sort((a,b)=>S.startDir==='asc'?startOf(a)-startOf(b):startOf(b)-startOf(a));
 return `<h1>Start list</h1><div class="clock" data-clock style="font-size:52px">${fmtClock(e)}</div><div id="banner">${nextBanner()}</div>
 <div class="seg"><button data-dir="asc" class="${S.startDir==='asc'?'on':''}">Slowest first</button><button data-dir="desc" class="${S.startDir==='desc'?'on':''}">Fastest first</button></div>
 <div class="card">${l.map(p=>{const s=startOf(p),go=s<=e&&(e>0||S.clock.running);return `<div class="item ${go?'':'waiting'}"><span class="bib">${p.bib}</span><span class="tag ${p.g}">${p.g}</span><div class="n"><b>${esc(p.name)}</b><small>Predicted ${fmt(p.total)}</small></div><div style="text-align:right"><span class="t">${s===0?'Start 0:00':'+'+fmt(s)}</span><br><small ${go?'':cd(s,'in ')}>${go?'Started':'in '+fmt(Math.ceil(s-e))}</small></div></div>`}).join('')||'<p class="mute">Add athletes first.</p>'}</div>
 <p class="mute">Handicap: the slowest predicted athlete (${fmt(maxTotal())}) starts at zero. Everyone else starts after the difference.</p>`}

function vRace(){
 const e=elapsed(),c=S.clock,v=S.raceView;
 const stt=p=>p.finish!=null?'fin':(startOf(p)<=e&&(e>0||c.running)?'rac':'wait');
 const ctl=c.running?'<button class="p" data-act="stop">Stop</button>':`<button class="p" data-act="go">${e>0?'Resume':'Start'}</button>`;
 const head=`<div class="card rc"><div class="clock" data-clock>${fmtClock(e)}</div><div class="btns">${ctl}<button data-act="reset">Reset</button></div></div><div id="banner">${nextBanner()}</div>
 <div class="seg">${[['grid','Grid'],['course','On course'],['keys','Keypad'],['list','List']].map(([k,l])=>`<button data-rv="${k}" class="${v===k?'on':''}">${l}</button>`).join('')}</div>`;
 const tile=(p,full)=>{const t=stt(p);return `<div class="tile ${p.g} ${t}" role="button" ${t==='fin'?`data-undo="${p.id}"`:t==='rac'?`data-fin="${p.id}"`:''}><b>${p.bib}</b><small class="nm">${esc(p.name)}</small>${t==='fin'?`<small class="ft">${fmt(p.finish)}</small>`:''}</div>`};
 let body;
 if(!S.people.length)body='<p class="mute">Add athletes first.</p>';
 else if(v==='grid')body=`<div class="grid">${S.people.slice().sort((a,b)=>a.bib-b.bib).map(p=>tile(p)).join('')}</div>`;
 else if(v==='course'){const r=S.people.filter(p=>stt(p)==='rac').sort((a,b)=>startOf(a)-startOf(b)),w=S.people.filter(p=>stt(p)==='wait').length,f=S.people.filter(p=>stt(p)==='fin').length;
  body=`<div class="grid g2">${r.map(p=>tile(p,1)).join('')}</div>${r.length?'':'<p class="mute">Nobody on course right now.</p>'}<p class="mute">${w} waiting to start, ${f} finished</p>`}
 else if(v==='keys'){const n=parseInt(S.kb,10),pp=S.people.find(x=>x.bib===n),last=S.people.filter(p=>p.finish!=null).sort((a,b)=>b.finish-a.finish).slice(0,2);
  body=`<div class="card"><div class="kd">${S.kb||'–'}</div><div class="mute" style="text-align:center;min-height:22px">${pp?'#'+pp.bib+' '+esc(pp.name)+' ('+{fin:'finished',rac:'racing',wait:'not started'}[stt(pp)]+')':S.kb?'No athlete with that number':'Type the race number, then Finish'}</div>
  <div class="pad">${['1','2','3','4','5','6','7','8','9','b','0'].map(k=>`<button data-key="${k}">${k==='b'?'⌫':k}</button>`).join('')}<button class="p" data-act="kfin">Finish</button></div></div>
  ${last.length?`<div class="card"><small class="mute">Last finished (tap to undo)</small>${last.map(p=>`<div class="item" data-undo="${p.id}"><span class="bib">${p.bib}</span><div class="n"><b>${esc(p.name)}</b></div><span class="t">${fmt(p.finish)}</span></div>`).join('')}</div>`:''}`}
 else{const l=S.people.slice().sort((a,b)=>{const fa=a.finish!=null,fb=b.finish!=null;if(fa!==fb)return fa?1:-1;if(fa)return a.finish-b.finish;return startOf(a)-startOf(b)});
  body=`<div class="card">${l.map(p=>{const s=startOf(p),t=stt(p),fin=t==='fin',rac=t==='rac';
  return `<div class="item ${fin?'done':rac?'racing':'waiting'}" ${fin?`data-undo="${p.id}"`:rac?`data-fin="${p.id}"`:''}><span class="bib">${p.bib}</span><span class="tag ${p.g}">${p.g}</span><div class="n"><b>${esc(p.name)}</b><small ${!fin&&!rac?cd(s,'Starts in '):''}>${fin?'Tap to undo':rac?'Racing — tap to finish':'Starts in '+fmt(Math.ceil(s-e))}</small></div>${fin?`<div style="text-align:right"><span class="t">${fmt(p.finish)}</span><br><small>actual ${fmt(p.finish-s)}</small></div>`:`<small>${s?'+'+fmt(s):'0:00'}</small>`}</div>`}).join('')}</div>`}
 return head+body}
function finishAthlete(p){p.finish=Math.round(elapsed());toast('#'+p.bib+' '+p.name+' finished '+fmt(p.finish));if(navigator.vibrate)navigator.vibrate(40);render()}
function keyFinish(){const n=parseInt(S.kb,10),p=S.people.find(x=>x.bib===n),e=elapsed();
 if(!p)return toast('No athlete with number '+(S.kb||'?'));
 if(p.finish!=null)return toast('#'+n+' already finished');
 if(!(startOf(p)<=e&&(e>0||S.clock.running)))return toast('#'+n+' has not started yet');
 S.kb='';finishAthlete(p)}
function results(){
 let r=S.people.filter(p=>p.finish!=null).map(p=>({...p,start:startOf(p),actual:p.finish-startOf(p)}));
 r.sort((a,b)=>S.resSort==='finish'?a.finish-b.finish:a.actual-b.actual);
 const all=r;if(S.resFilter!=='all')r=r.filter(p=>p.g===S.resFilter);return {all,r}}
function vResults(){
 const {all,r}=results(),best=g=>all.find(p=>p.g===g),tm=p=>S.resSort==='finish'?p.finish:p.actual;
 const card=(g,n)=>{const b=best(g);return `<div class="card"><small>Top ${n}</small>${b?`<div><b>#${b.bib} ${esc(b.name)}</b></div><div class="t">${fmt(tm(b))}</div>`:'<div class="mute">No finisher yet</div>'}</div>`};
 return `<h1>Results</h1><p class="mute" style="margin-top:-6px">${all.length} of ${S.people.length} finished</p>
 <div class="top">${card('F','female')}${card('M','male')}</div>
 <div class="card"><div class="row" style="grid-template-columns:1fr 1fr"><div><label>Sort by</label><select id="rs"><option value="finish" ${S.resSort==='finish'?'selected':''}>Total time (finish order)</option><option value="actual" ${S.resSort==='actual'?'selected':''}>Actual time (fastest)</option></select></div>
 <div><label>Show</label><select id="rf">${[['all','Everyone'],['F','Female'],['M','Male']].map(([v,l])=>`<option value="${v}" ${S.resFilter===v?'selected':''}>${l}</option>`).join('')}</select></div></div>
 <div class="wrap"><table><tr><th>Pos</th><th>Bib</th><th>Name</th><th>M/F</th><th>Handicap start</th><th>Total time</th><th>Actual time</th></tr>
 ${r.map((p,i)=>`<tr><td>${i+1}</td><td><span class="bib">${p.bib}</span></td><td>${esc(p.name)}</td><td><span class="tag ${p.g}">${p.g}</span></td><td class="t">${fmt(p.start)}</td><td class="t">${fmt(p.finish)}</td><td class="t">${fmt(p.actual)}</td></tr>`).join('')||'<tr><td colspan="7" class="mute">No finishers to show.</td></tr>'}</table></div>
 <div class="btns" style="margin-top:12px"><button class="p" data-act="csv">Export CSV</button><button data-act="xlsx">Export Excel</button></div></div>`}

function exportRows(){const {r}=results();return [['Rank','Bib','Name','Gender','Handicap start','Total time','Actual time'],...r.map((p,i)=>[i+1,p.bib,p.name,p.g,fmt(p.start),fmt(p.finish),fmt(p.actual)])]}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csvOf=rows=>rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');

function addPerson(o){S.people.push({id:Date.now()+Math.random(),finish:null,...o})}
function savePerson(){
 const name=$('#f-name').value.trim(),t=readTimes();
 const bib=parseInt($('#f-bib').value,10);if(!name)return toast('Enter a name');if(!bib||bib<1)return toast('Enter a race number');if(S.people.some(p=>p.bib===bib&&p.id!==S.edit))return toast('Race number '+bib+' is already used');if(t==null||t<=0)return toast('Enter valid times');
 const o={bib,name,g:$('#f-g').value,total:t};
 if(S.mode==='legs')o.legs={swim:parseT($('#f-swim').value),bike:parseT($('#f-bike').value),run:parseT($('#f-run').value)};else o.legs=null;
 if(S.edit){Object.assign(S.people.find(p=>p.id===S.edit),o);S.edit=null;toast('Saved')}else{addPerson(o);toast('Added '+name)}
 render();if(!S.edit)setTimeout(()=>{const n=$('#f-name');n&&n.focus()},50)}

async function importFile(f){
 if(!window.XLSX)return toast('Spreadsheet reader not loaded. Check your internet connection.');
 try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
 const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
 const h=rows[0].map(x=>String(x).toLowerCase()),ix=re=>h.findIndex(x=>re.test(x));
 const c={n:ix(/name|athlete|participant/),g:ix(/gender|sex|m\/f/),s:ix(/swim/),b:ix(/bike|cycle|ride/),r:ix(/run/),t:ix(/total|predicted|race time|^time/),bib:ix(/bib|number|race\s*no|^no\.?$|^#/)};
 if(c.n<0)return toast('No "Name" column found');
 let n=0,bad=0;
 rows.slice(1).forEach(r=>{const name=String(r[c.n]||'').trim();if(!name)return;
  const g=/^f/i.test(String(r[c.g]||'').trim())?'F':'M';
  const legs=[c.s,c.b,c.r].map(i=>i>=0?parseT(r[i]):null);let total,L=null;
  if(legs.every(x=>x!=null)){L={swim:legs[0],bike:legs[1],run:legs[2]};total=legs[0]+legs[1]+legs[2]}else total=c.t>=0?parseT(r[c.t]):null;
  if(!total){bad++;return}let bib=parseInt(c.bib>=0?r[c.bib]:'',10);if(!bib||S.people.some(p=>p.bib===bib))bib=nextBib();addPerson({bib,name,g,total,legs:L});n++});
 toast(`Imported ${n}${bad?`, skipped ${bad} without times`:''}`);render()}catch(e){toast('Could not read that file')}}

document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-fin],[data-undo]');if(!t)return;if(t.id==='dyes'){$('#dlg').hidden=true;const f=ask.cb;ask.cb=null;f&&f();return}if(t.id==='dno'){$('#dlg').hidden=true;return}const d=t.dataset;
 if(d.tab){S.tab=d.tab;render();window.scrollTo(0,0)}
 else if(d.mode){S.mode=d.mode;render()}
 else if(d.dir){S.startDir=d.dir;render()}
 else if(d.edit){S.edit=+d.edit;const p=S.people.find(p=>p.id===S.edit);S.mode=p.legs?'legs':'total';render();window.scrollTo(0,0)}
 else if(d.del){const p=S.people.find(p=>p.id==d.del);ask('Remove '+p.name+'?',()=>{S.people=S.people.filter(x=>x!==p);render()})}
 else if(d.fin){finishAthlete(S.people.find(p=>p.id==d.fin))}
 else if(d.rv){S.raceView=d.rv;render()}
 else if(d.key!=null){S.kb=d.key==='b'?S.kb.slice(0,-1):(S.kb+d.key).slice(0,3);render()}
 else if(d.undo){const p=S.people.find(p=>p.id==d.undo);ask('Clear finish time for '+p.name+'?',()=>{p.finish=null;render()})}
 else if(d.act){const a=d.act;
  if(a==='save')savePerson();
  else if(a==='cancel'){S.edit=null;render()}
  else if(a==='kfin')keyFinish();
  else if(a==='clear'){ask('Remove all athletes?',()=>{S.people=[];render()})}
  else if(a==='go'){S.clock={running:true,startedAt:Date.now(),acc:S.clock.acc};render()}
  else if(a==='stop'){S.clock={running:false,startedAt:0,acc:elapsed()};render()}
  else if(a==='reset'){ask('Reset the clock and clear ALL finish times?',()=>{S.clock={running:false,startedAt:0,acc:0};S.people.forEach(p=>p.finish=null);render()})}
  else if(a==='csv')download('triathlon-results.csv',new Blob([csvOf(exportRows())],{type:'text/csv'}));
  else if(a==='xlsx'){if(!window.XLSX)return toast('Excel export needs internet. Use CSV.');const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(exportRows()),'Results');XLSX.writeFile(wb,'triathlon-results.xlsx')}
  else if(a==='tpl')download('triathlon-template.csv',new Blob([csvOf([['Bib','Name','Gender','Swim','Bike','Run','Total'],['1','Sample Athlete','F','10:30','35:00','22:15',''],['2','Total-only Athlete','M','','','','65:40']])],{type:'text/csv'}))}
});
document.addEventListener('change',e=>{
 if(e.target.id==='file'&&e.target.files[0])importFile(e.target.files[0]);
 if(e.target.id==='rs'){S.resSort=e.target.value;render()}
 if(e.target.id==='rf'){S.resFilter=e.target.value;render()}
});
setInterval(()=>{if(S.tab!=='race'&&S.tab!=='start')return;if(sig()!==lastSig)return render();const e=elapsed();document.querySelectorAll('[data-clock]').forEach(x=>x.textContent=fmtClock(e));document.querySelectorAll('[data-cd]').forEach(x=>x.textContent=x.dataset.pre+fmt(Math.ceil(+x.dataset.cd-e)));const b=$('#banner');if(b)b.innerHTML=nextBanner()},250);
render();
</script>
</body>
